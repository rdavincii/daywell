name: Build and Deploy

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04 # 1. Fixes the Ubuntu 26 migration warning
    steps:
      - name: Checkout repository 🛎️
        uses: actions/checkout@v4

      - name: Install Node.js & dependencies 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 2. Upgrades Node to clear the deprecation warning
          # removed the cache: 'npm' line to fix the missing lock file error

      - name: Build project 🚀
        run: |
          npm install
          npm run build 

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist 
          branch: gh-pages 
